# This file was auto-generated by the Firebase CLI

name: Preview Voxidence Web

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install and build web
        working-directory: web
        env:
          REACT_APP_API_BASE_URL: https://voxidence-api.onrender.com
          REACT_APP_API_URL: https://voxidence-api.onrender.com
          REACT_APP_SOCKET_URL: https://voxidence-api.onrender.com
          REACT_APP_API_TIMEOUT_MS: 180000
          REACT_APP_ENABLE_STRICT_MODE: false
          REACT_APP_CONTACT_EMAIL: voxidence@gmail.com
        run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXORA_AI_58018 }}
          projectId: nexora-ai-58018
          entryPoint: web
          target: voxidence